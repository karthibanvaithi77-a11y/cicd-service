apiVersion: apps/v1
kind: Deployment

metadata:
  name: cicd-service

spec:
  replicas: 2

  selector:
    matchLabels:
      app: cicd-service

  template:
    metadata:
      labels:
        app: cicd-service

    spec:
      containers:
        - name: cicd-service
          image: cicd-service:latest
          imagePullPolicy: Never

          ports:
            - containerPort: 9090